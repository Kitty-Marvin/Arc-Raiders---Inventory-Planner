name: Publish ARC Planner and refresh item catalog

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1,4' # every Monday and Thursday (UTC)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: arc-planner-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update cached ARC Raiders items (MetaForge / ARDB)
        run: python scripts/update_catalog.py --source all
        continue-on-error: true # old cache stays available if source is down
      - name: Save refreshed catalogs to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog/metaforge.json catalog/ardb.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh ARC Raiders item cache'
            git push
          fi
      - name: Prepare public site (omit scripts and rules)
        run: |
          mkdir -p public/catalog
          cp index.html app.js firebase-config.js .nojekyll public/
          cp catalog/*.json public/catalog/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
